{% extends 'base.html' %}
{% block title %}Sign In | MediCare+ Clinic Management{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="page-eyebrow">CLINIC ACCESS PORTAL</div>
      <h1 class="page-title" style="font-size:28px;">Sign In</h1>
      <p class="page-desc">Enter your clinic username and password to access your workspace.</p>
    </div>

    <form method="post" action="{{ url_for('login') }}">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-control" type="text" name="username" required placeholder="Enter your username" autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:14px; font-size:15px; padding:12px;">Sign In &rarr;</button>
    </form>

    <div style="text-align:center; margin-top:24px; font-size:14px; color:var(--text-muted); border-top:1px solid var(--border); padding-top:18px;">
      Don't have an account yet? <a href="{{ url_for('register') }}" style="font-weight:700; color:var(--primary);">Register New Patient</a>
    </div>
  </div>
</div>
{% endblock %}
