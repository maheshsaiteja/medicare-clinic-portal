services:
  - type: web
    name: medicare-clinic-portal
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python init_db.py || true
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: REQUIRE_MYSQL
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL_CERT_CONTENT
        sync: false
