name: Render 24/7 Keep-Alive

on:
  schedule:
    # Triggers every 10 minutes to prevent Render free-tier instance from sleeping (Render sleeps after 15m)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Render Web Service
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping
        run: |
          TARGET_URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://medicare-clinic-system.onrender.com"
          fi
          echo "Pinging health endpoint at: $TARGET_URL/healthz"
          curl -sSL --max-time 15 "$TARGET_URL/healthz" || curl -sSL --max-time 20 "$TARGET_URL" || true
